version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-userdb}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@db:5432/${DATABASE_NAME:-userdb}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      USE_MOCK_INGEST: ${USE_MOCK_INGEST:-true}
      NODE_ENV: development
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    networks:
      - app-network
    command: >
      sh -c "npx prisma migrate deploy && 
             npx prisma db seed && 
             npm run start:prod"

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge